name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: flutter pub get

      - name: Install ObjectBox native library
        run: bash <(curl -s https://raw.githubusercontent.com/objectbox/objectbox-dart/main/install.sh)

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Generated ObjectBox bindings are up to date
        run: git diff --exit-code -- lib/objectbox.g.dart lib/objectbox-model.json

      - run: flutter analyze

      - name: Test
        run: flutter test
        env:
          CI: 'true'
          OBJECTBOX_LIB_DIR: ${{ github.workspace }}

      - run: dart run tool/check_docs.dart
