name: virtual_heart
description: "VirtualHeart — On-device AI romantic companion app powered by Gemma 3 1B."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # AI / LLM inference (on-device, MediaPipe)
  flutter_gemma: ^0.12.5

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local database (ObjectBox)
  objectbox: ^4.0.3
  objectbox_flutter_libs: any
  path_provider: ^2.1.5

  # Navigation
  go_router: ^14.8.1

  # UI / Fonts / Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  gpt_markdown: ^1.1.4

  # TTS / STT
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  permission_handler: ^12.0.0+1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  objectbox_generator: any
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/models/Gemma3-1B-IT_multi-prefill-seq_q4_ekv2048.task
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
