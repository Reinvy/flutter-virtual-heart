name: virtual_heart
description: "VirtualHeart — On-device AI romantic companion app powered by Small Language Model (SLM)."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # AI / LLM inference (on-device) — core API
  flutter_gemma: ^1.6.5
  # MediaPipe (.task) inference engine (Android/iOS/Web)
  flutter_gemma_mediapipe: ^1.0.5
  # LiteRT-LM (.litertlm) engine — diperlukan untuk model baru & speech on-device
  flutter_gemma_litertlm: ^1.4.0
  # On-device speech (STT + TTS) via LiteRT C API
  flutter_gemma_speech: ^0.4.3

  # State management
  flutter_riverpod: ^3.4.2

  # Local database (ObjectBox)
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  path_provider: ^2.1.6

  # Navigation
  go_router: ^18.0.0

  # UI / Fonts / Animations
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  flutter_svg: ^2.0.17
  lottie: ^3.5.1
  gpt_markdown: ^1.2.1

  # Voice (on-device via flutter_gemma_speech)
  record: 5.1.2
  flutter_pcm_sound: ^3.3.3
  file_picker: ^8.3.7

  # Notifications
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.3
  permission_handler: ^13.0.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  objectbox_generator: any

# record_linux 0.7.2 tidak kompatibel dengan record_platform_interface 1.1+
# (startStream belum diimplementasikan). STT kami memakai rekam ke file, jadi
# pin RPI ke 1.0.2 (tanpa startStream) aman.
dependency_overrides:
  record_platform_interface: 1.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/icons/
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
