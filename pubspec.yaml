name: virtual_heart
description: "VirtualHeart — On-device AI romantic companion app powered by Small Language Model (SLM)."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.10.0

  # On-device AI (pengganti paket AI lama yang sudah discontinued)
  flutter_edge_ai: ^2.6.0
  flutter_edge_ai_litertlm: ^1.20.0
  flutter_edge_ai_mediapipe: ^1.3.0
  flutter_edge_ai_speech: ^0.6.0

  flutter_riverpod: ^3.5.0
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  path_provider: ^2.1.6
  go_router: ^18.1.3

  google_fonts: ^9.0.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.2
  gpt_markdown: ^1.4.1

  record: ^7.1.2
  flutter_pcm_sound: ^3.3.3
  file_picker: ^13.3.2
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0

  flutter_local_notifications: ^23.0.0
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2

  intl: ^0.20.3
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Dipin exact: objectbox_generator 5.3.2 butuh analyzer <11 dan build <5.0.0.
  build_runner: 2.15.1
  objectbox_generator: 5.3.2
  yaml: ^3.1.3 # tool/check_docs.dart

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
